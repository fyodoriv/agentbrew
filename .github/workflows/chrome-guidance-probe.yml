name: Pinned Chrome guidance offline control
on:
  push:
    branches: [probe/chrome-guidance-offline]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Unpack the exact public release
        run: |
          mkdir "$RUNNER_TEMP/guidance"
          curl -fsSL 'https://registry.npmjs.org/modern-web-guidance/-/modern-web-guidance-1.0.1.tgz' -o "$RUNNER_TEMP/guidance/package.tgz"
          python3 - "$RUNNER_TEMP/guidance" <<'PY'
          from pathlib import Path
          import base64, hashlib, sys, tarfile
          root = Path(sys.argv[1])
          archive = root / "package.tgz"
          expected = "5ztUh5F1p2PewnSkA6EhsGUXqomaZY9qe6iWJCU4JbIQxHTky7s5lMJcPE4EbD1uhbQZIhl0HROH0+s6fIiGzg=="
          assert base64.b64encode(hashlib.sha512(archive.read_bytes()).digest()).decode() == expected
          with tarfile.open(archive) as package:
              package.extractall(root, filter="data")
          references = root / "package/skills/chrome-extensions/references/extensions"
          assert (references / "side-panel.md").is_file()
          PY
      - name: Search, retrieve, and scan without network access
        run: |
          fixture="$RUNNER_TEMP/guidance"
          mkdir "$fixture/site"
          cat > "$fixture/site/app.js" <<'JS'
          const textarea = document.querySelector("textarea");
          textarea.addEventListener("input", () => {
            textarea.style.height = "auto";
            textarea.style.height = textarea.scrollHeight + "px";
          });
          JS
          cli="$fixture/package/skills/modern-web-guidance/modern-web.mjs"
          safe_node() {
            sudo unshare --net -- runuser -u "$(id -un)" -- "$(command -v node)" "$cli" "$@"
          }
          safe_node search 'light dismiss dialog' > "$fixture/search.json"
          jq -e 'any(.[]; .id == "light-dismiss-a-dialog")' "$fixture/search.json"
          safe_node retrieve light-dismiss-a-dialog > "$fixture/guide.md"
          rg -qi 'closedby|light dismiss' "$fixture/guide.md"
          safe_node legacy-scan "$fixture/site" --json > "$fixture/scan.json"
          jq -e 'type == "object" or type == "array"' "$fixture/scan.json"
          rg -q 'form-fields-automatically-fit-contents' "$fixture/scan.json"
          printf '%s\n' 'Pinned search, retrieval, seeded scan, and extension reference passed.'
