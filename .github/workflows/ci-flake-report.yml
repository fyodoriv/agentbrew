name: CI flake report

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Read CI run attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/gh-actions-flake-tracker.mjs --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/ci-flakes.json"; then
            {
              printf '### CI flake evidence\n\n```json\n'
              cat "$RUNNER_TEMP/ci-flakes.json"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'CI flake evidence is unavailable.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
