name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npx vitest run src/update.test.ts src/integration.test.ts --maxWorkers=1 --retry=0 -t 'recorded plugin conversion|ordinary refresh behavior|report a conversion from a|during real sync after a recorded conversion|when plain sync refreshes'

      - name: Verify that the real sync fixture rejects missing ownership protection
        run: |
          sed -i 's/ || recordedSkillConversion(source, name)//' src/sync/skills-sync.ts
          if npx vitest run src/integration.test.ts --maxWorkers=1 --retry=0 -t 'during real sync after a recorded conversion' > "$RUNNER_TEMP/absent-protection.log" 2>&1; then
            exit 1
          fi
          grep -F 'expected [ { label:' "$RUNNER_TEMP/absent-protection.log"
