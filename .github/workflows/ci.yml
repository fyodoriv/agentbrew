name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Observe normal, setup timeout, and caller timeout
        shell: bash
        run: |
          fixture='src/skills/wrap-up-open-work.test.ts'
          npx vitest run "$fixture" --maxWorkers=1 --retry=0 -t 'observes the real wrap-up caller'
          scratch="$(mktemp -d)"
          export WRAP_FIXTURE_REAL_GIT="$(command -v git)"
          cat > "$scratch/git" <<'SH'
          #!/bin/bash
          if [ "$1" = init ]; then exec /bin/sleep 7; fi
          exec "$WRAP_FIXTURE_REAL_GIT" "$@"
          SH
          chmod +x "$scratch/git"
          if PATH="$scratch:$PATH" npx vitest run "$fixture" --maxWorkers=1 --retry=0 -t 'W04.*observes the real wrap-up caller' > "$scratch/setup.log" 2>&1; then
            exit 1
          fi
          grep -F 'FETCH_CALLER_OBSERVATION {"id":"W04","status":"inconclusive","phase":"git-setup","reason":"timeout"}' "$scratch/setup.log" || { tail -30 "$scratch/setup.log"; exit 1; }
          caller='skill-plugins/workflow/wrap-up/scripts/open-work.sh'
          sed -i '2i /bin/sleep 22' "$caller"
          if npx vitest run "$fixture" --maxWorkers=1 --retry=0 -t 'W03.*observes the real wrap-up caller' > "$scratch/caller.log" 2>&1; then
            exit 1
          fi
          grep -F 'FETCH_CALLER_OBSERVATION {"id":"W03","status":"inconclusive","phase":"caller","reason":"timeout"}' "$scratch/caller.log" || { tail -30 "$scratch/caller.log"; exit 1; }
