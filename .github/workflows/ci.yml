name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Run the delayed claimant control
        env:
          CHAT_RULE_FIXTURE_STRESS_DELAY_MS: "4500"
        run: node --test --test-name-pattern='^concurrent attempts admit one$' scripts/eval-chat-message-rule-821.test.mjs
