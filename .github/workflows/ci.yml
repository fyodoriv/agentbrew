name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Invalid preflight through isolated entry points
        env:
          SYNC_SELECTION_OBSERVATION_CAPTURE: "1"
        run: npx vitest run --config vitest.sync-selection-observation.config.ts -t 'invalid preflight regression' --maxWorkers=1 --retry=0 --reporter=default --silent=false
      - name: Explicit invalid selections before state
        if: always()
        run: npx vitest run src/update.test.ts -t 'rejects invalid pull selection' --maxWorkers=1 --retry=0
      - name: Ordinary CLI and update compatibility
        if: always()
        run: npx vitest run src/cli.test.ts src/cli-helpers.test.ts src/update.test.ts --maxWorkers=1 --retry=0
