name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --no-banner

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Skill eval coverage
        run: npm run skills:coverage

      - name: Test
        run: npm test

      - name: Set up Rust for the native judge reader
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Build
        run: npm run build

      - name: Verify installed judge reader and PR gate
        run: npm run test:real-e2e -- real-e2e/scenarios/us01-us21-npm-package-hooks.test.ts

      - name: Agent config bloat lint
        run: node dist/cli.js lint

      - name: Check source line count
        run: |
          # Warn (not fail) when non-test source lines exceed 18K.
          # Target is to keep the codebase below 20K — delete before adding.
          count=$(find src -name '*.ts' ! -name '*.test.ts' | xargs wc -l | tail -1 | awk '{print $1}')
          echo "Non-test source lines: $count / 18000 warning threshold"
          if [ "$count" -gt 18000 ]; then
            echo "::warning::Source line count ($count) exceeds 18K — delete before adding more code"
          else
            echo "✓ Source line count within budget"
          fi

      - name: Verify dist
        run: |
          test -f dist/cli.js || { echo "ERROR: dist/cli.js missing"; exit 1; }
          test -f dist/catalog.yaml || { echo "ERROR: dist/catalog.yaml missing"; exit 1; }
          node dist/cli.js --version

  judge-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Build the judge CLI
        run: |
          npm ci
          npm run build
      - name: Start pinned local model
        run: |
          docker run --detach --name agentbrew-judge-ollama \
            --publish 127.0.0.1:11434:11434 \
            --env OLLAMA_NO_CLOUD=1 \
            ollama/ollama@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-connrefused --max-time 3 http://127.0.0.1:11434/api/version >/dev/null
          timeout 5m docker exec agentbrew-judge-ollama ollama pull llama3.2:3b
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:11434/api/tags |
            jq -e 'any(.models[]; .name == "llama3.2:3b" and .digest == "a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72")' >/dev/null
      - name: Require judge calibration agreement
        run: bash scripts/check-judge-calibration.sh
      - name: Stop local model
        if: always()
        run: docker container stop agentbrew-judge-ollama || true
