name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-tool-signer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fyodoriv/dotfiles
          ref: c7d9f64c4625e8a7efdcde23420bd1b78bc9134a
          path: fixture-dotfiles
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: sudo apt-get update && sudo apt-get install -y jq yq
      - run: npm ci
      - run: node --import tsx scripts/cross-tool-signer-scratch.mjs fixture-dotfiles
