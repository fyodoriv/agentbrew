name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-native-facets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Focus on ordinary selected Agentfile preparation
        run: npx vitest run src/plugins/plugins.test.ts -t 'shared signer writer admission' --maxWorkers=1 --retry=0
      - name: Check normal native plugin and launcher compatibility
        run: npx vitest run src/plugins/plugins.test.ts src/plugins/cli-plugin.test.ts src/plugins/claude-native.test.ts src/plugins/mcp-launcher.test.ts --maxWorkers=1 --retry=0
      - name: Verify the candidate types
        run: npm run typecheck
