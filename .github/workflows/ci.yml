name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-invalid-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Build the candidate
        run: |
          git diff --exit-code e8f930b22ce618fa103bf7cd7e2a6adeea387db0 HEAD -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)docs/plans/sync-selection-real-child-preflight.md' \
            ':(exclude)scripts/fixtures/sync-child-deny.mjs' \
            ':(exclude)scripts/fixtures/sync-child-proof.py'
          npm ci
          npm run build
      - name: Check real CLI behavior in synthetic homes
        run: |
          node="$(command -v node)"
          outside_net="$(readlink /proc/self/ns/net)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          stage="$(mktemp -d "${RUNNER_TEMP}/sync-proof.XXXXXXXX")"
          sudo unshare --net --setuid "$runner_uid" --setgid "$runner_gid" \
            /usr/bin/env -i PATH=/usr/bin:/bin python3 \
            scripts/fixtures/sync-child-proof.py "$node" "$PWD" "$outside_net" \
            "$runner_uid" "$(git rev-parse HEAD)" e8f930b22ce618fa103bf7cd7e2a6adeea387db0 "$stage"
