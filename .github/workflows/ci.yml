name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-sync-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Check all affected selection and startup contracts
        run: npx vitest run src/cli-sync-agentfile.test.ts src/commands/cli-install.test.ts src/sync-runner.test.ts src/cli-sync-build-health.test.ts src/update.test.ts src/cli-sync-pull.test.ts --maxWorkers=1 --retry=0
      - name: Check types
        run: npm run typecheck
