name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  clean-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate compares the branch with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No npm cache: measured slower than a cold `npm ci` (docs/ci.md).

      - name: Install
        run: npm ci

      - name: Run the health fixture in five separate processes
        run: |
          for run in 1 2 3 4 5; do
            npx vitest run src/integration.test.ts -t 'reports clean when everything is in sync'
          done
      - name: Run the full integration file
        run: npx vitest run src/integration.test.ts
