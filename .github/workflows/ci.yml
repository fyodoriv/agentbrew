name: CI

# The hosted copy of the local gate: `npm run verify`, the same command a
# contributor runs before a push. Hosted on GitHub's standard runners, which
# are free for public repositories. See docs/ci.md.
#
# Safety:
# - No secrets are used. A fork PR gets a read-only token and no secrets.
# - The private-pattern leak gate cannot run here: its pattern file lives
#   only on the owner's machine. The local pre-push gate stays the authority.
# - Steps never print the environment.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate_timeout_probe:
        description: Run a macOS timeout probe that is expected to fail
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ inputs.gate_timeout_probe && '-timeout-probe' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never send usage data or event logs from a runner.
  DO_NOT_TRACK: "1"
  AGENTBREW_EVENTS: "0"

jobs:
  verify:
    name: ${{ inputs.gate_timeout_probe && 'verify timeout probe' || 'verify' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.gate_timeout_probe && '["macos-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate compares the branch with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No npm cache: measured slower than a cold `npm ci` (docs/ci.md).

      - name: Check lockfile integrity before install
        if: ${{ !inputs.gate_timeout_probe }}
        run: node scripts/check-lockfile-integrity.mjs --github-actions

      - name: Install
        if: ${{ !inputs.gate_timeout_probe }}
        run: npm ci

      - name: Install test tools
        if: ${{ !inputs.gate_timeout_probe }}
        # git-filter-repo: the test of scripts/sanitize-history.sh needs it.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install git-filter-repo
          else
            # PyPI fallback: a runner DNS failure for the Ubuntu archive
            # must not stop the gate.
            { sudo apt-get update && sudo apt-get install -y git-filter-repo; } ||
              pipx install git-filter-repo
          fi

      - name: Cache Playwright browsers
        if: ${{ !inputs.gate_timeout_probe }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Identify the gate cache runner image
        if: ${{ !inputs.gate_timeout_probe }}
        id: gate-image
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ] || [ -z "${RUNNER_ARCH:-}" ]; then
            exit 0
          fi
          printf 'scope=gate-%s-%s-%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH" >> "$GITHUB_OUTPUT"

      - name: Restore the gate step cache
        # scripts/verify.sh skips a step whose inputs passed before, like nx.
        # A cache entry cannot be changed, so each run saves a new one and
        # restores the newest. A pull request reads its own entries and
        # main's; it cannot write to main's.
        if: steps.gate-image.outputs.scope != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gate-cache
          key: ${{ steps.gate-image.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.gate-image.outputs.scope }}-

      - name: Prepare the gate trace and cache
        run: |
          printf 'AGENTBREW_GATE_TRACE=%s/gate-trace.tsv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'AGENTBREW_GATE_CACHE_DIR=%s/gate-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/gate-trace.tsv"

      - name: Prepare the timeout probe
        if: inputs.gate_timeout_probe
        run: |
          printf 'probe-sleep sleep 75\n' > "$RUNNER_TEMP/gate-probe.plan"
          printf 'VERIFY_PLAN=%s/gate-probe.plan\nNO_CACHE=1\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Gate (npm run verify)
        timeout-minutes: ${{ inputs.gate_timeout_probe && 1 || 40 }}
        run: npm run verify

      - name: Record an interrupted gate step
        if: always() && env.AGENTBREW_GATE_TRACE != ''
        run: |
          step=$(awk -F '\t' 'END { if ($2 == "start" && $3 ~ /^[A-Za-z0-9_-]+$/) print $3 }' "$AGENTBREW_GATE_TRACE")
          if [ -n "$step" ]; then
            printf '%s\tend\t%s\tinterrupted\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$step" >> "$AGENTBREW_GATE_TRACE"
          fi

      - name: Upload the gate trace
        if: always() && env.AGENTBREW_GATE_TRACE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-log-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-trace.tsv
