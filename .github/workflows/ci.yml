name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixture:
    name: Perf gate fixtures (${{ matrix.os }}, batch ${{ matrix.batch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, batch: 0, runs: 1}
          - {os: macos-latest, batch: 1, runs: 5}
          - {os: macos-latest, batch: 2, runs: 5}
          - {os: macos-latest, batch: 3, runs: 5}
          - {os: macos-latest, batch: 4, runs: 5}
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Run the whole test file without retry
        env:
          FIXTURE_RUNS: ${{ matrix.runs }}
        run: |
          for run in $(seq "$FIXTURE_RUNS"); do
            echo "Independent fixture process $run of $FIXTURE_RUNS"
            npx vitest run src/scripts/perf-gate.test.ts --maxWorkers=1 --retry=0
          done
