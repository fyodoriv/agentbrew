name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Filtered lifecycle stage controls
        run: |
          set -euo pipefail
          for mode in 0 1; do
            export PLUGIN_LIFECYCLE_FIXTURE_OUTPUT="$mode"
            npx vitest run src/plugins/cli-plugin.test.ts -t '^plugin lifecycle observation output$' --maxWorkers=1 --retry=0 --reporter=default --silent=false >"/tmp/lifecycle-stage-$mode.log" 2>&1
            python3 - "$mode" <<'PYCONTROL'
          import json, math, pathlib, sys
          mode = sys.argv[1]
          data = pathlib.Path("/tmp/lifecycle-stage-" + mode + ".log").read_text()
          assert "OBSERVATION_PAYLOAD_CANARY" not in data, "private fixture marker on the worker stream"
          prefix = "lifecycle-stage "
          rows = [json.loads(x[len(prefix):]) for x in data.splitlines() if x.startswith(prefix)]
          expected = [] if mode == "0" else [("add", "begin"), ("add", "complete"), ("release", "begin"), ("remove", "begin"), ("remove", "failed")]
          assert len(rows) == len(expected), f"expected {len(expected)} fixed worker records, received {len(rows)}"
          begins = {}
          for row, pair in zip(rows, expected):
              assert (row["stage"], row["state"]) == pair
              assert row["invocation"] == "marketplace-copy"
              keys = {"invocation", "stage", "state", "time"}
              assert math.isfinite(row["time"])
              if row["state"] == "begin":
                  begins[row["stage"]] = row["time"]
              else:
                  keys.add("duration")
                  assert math.isfinite(row["duration"]) and row["duration"] >= 0
                  assert row["time"] >= begins[row["stage"]]
              assert set(row) == keys
          print(f"Lifecycle worker output mode {mode}: {len(rows)} fixed records, no fixture marker")
          PYCONTROL
          done
