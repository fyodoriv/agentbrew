name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify paused baseline, candidate, and timeout-disabled control
        shell: bash
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import os
          from pathlib import Path
          import shutil
          import signal
          import subprocess
          import tempfile
          import time

          fixture = Path("hooks/checks/updates-landed.test.sh")
          hook = Path("hooks/checks/updates-landed.sh")

          def run(path, directory, pause):
              env = dict(os.environ, TMPDIR=str(directory))
              with subprocess.Popen(["bash", str(path)], env=env, stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT, text=True, start_new_session=True) as proc:
                  try:
                      if pause:
                          deadline = time.monotonic() + 12
                          while not list(directory.glob("*/updates-landed-started")):
                              if proc.poll() is not None or time.monotonic() >= deadline:
                                  raise RuntimeError("hung child did not announce startup")
                              time.sleep(.01)
                          os.kill(proc.pid, signal.SIGSTOP)
                          time.sleep(10)
                          os.kill(proc.pid, signal.SIGCONT)
                      output, _ = proc.communicate(timeout=50)
                      return proc.returncode, output
                  finally:
                      if proc.poll() is None:
                          os.killpg(proc.pid, signal.SIGKILL)

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              for label in ("baseline", "candidate", "mutation"):
                  scratch = root / label
                  shutil.copytree("hooks", scratch / "hooks")
              baseline = root / "baseline" / fixture
              old = subprocess.check_output(["git", "show", "b784cd4c:" + str(fixture)], text=True)
              assert "sleep 30" in old
              baseline.write_text(old.replace("sleep 30", 'touch "$HOME/../updates-landed-started"\\nsleep 30', 1))
              changed_hook = root / "mutation" / hook
              original = changed_hook.read_text()
              assert original.count("alarm 3;") == 1
              changed_hook.write_text(original.replace("alarm 3;", "alarm 0;"))
              code, output = run(baseline, root / "baseline", pause=True)
              print(output, flush=True)
              assert code == 1 and "hung script -> silent within 5s" in output
              def candidate(i):
                  directory = root / "candidate" / str(i)
                  directory.mkdir()
                  return run(root / "candidate" / fixture, directory, pause=True)
              with ThreadPoolExecutor(max_workers=5) as pool:
                  results = list(pool.map(candidate, range(10)))
              for i, (code, output) in enumerate(results, start=1):
                  print(f"Paused candidate {i}: {output.strip()}", flush=True)
                  assert code == 0
              code, output = run(root / "mutation" / fixture, root / "mutation", pause=False)
              print(output, flush=True)
              assert code == 1 and "hung script started and the hook returned silently" in output
              print("Baseline rejected; paused candidate passed 10/10; timeout-disabled hook rejected")
          PY
