name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-signer-writer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Check signers against the shared registry
        run: npx vitest run src/plugins/signers.test.ts --maxWorkers=1 --retry=0
      - name: Check signed plugin lifecycle compatibility
        if: runner.os != 'Windows'
        run: npx vitest run src/plugins/cli-plugin.test.ts src/plugins/plugins.test.ts src/plugins/claude-native.test.ts --maxWorkers=1 --retry=0
      - name: Check types
        if: runner.os == 'Linux'
        run: npm run typecheck
