name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Verify default and dedicated discovery
        run: |
          npx vitest list --filesOnly --staticParse > "$RUNNER_TEMP/default.list"
          npx vitest list --config vitest.sync-selection-observation.config.ts --filesOnly --staticParse > "$RUNNER_TEMP/dedicated.list"
          grep -Fq 'src/cli.test.ts' "$RUNNER_TEMP/default.list"
          if grep -Fq 'src/sync-selection-observation.prep.test.ts' "$RUNNER_TEMP/default.list"; then exit 1; fi
          grep -Fq 'src/sync-selection-observation.prep.test.ts' "$RUNNER_TEMP/dedicated.list"
          test "$(grep -c 'test.ts' "$RUNNER_TEMP/dedicated.list")" = 1
      - name: Calibrate the observer with target capture disabled
        run: npx vitest run --config vitest.sync-selection-observation.config.ts --maxWorkers=1 --retry=0
