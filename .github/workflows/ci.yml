name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Select the preregistered npm
        run: npm install --prefix "$RUNNER_TEMP/qualified-npm" --no-audit --no-fund --ignore-scripts --package-lock=false npm@10.9.9
      - name: Compare the two frozen helper observations
        run: |
          export LOCKED_INSTALL_OBSERVATION=1
          export LOCKED_INSTALL_OBSERVATION_NPM_CLI="$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js"
          status=0
          npx vitest run src/worktree-deps.test.ts -t 'N[23] records physical content' --maxWorkers=1 --retry=0 --reporter=default --silent=false > "$RUNNER_TEMP/locked-install-observations.log" 2>&1 || status=$?
          python3 - "$RUNNER_TEMP/locked-install-observations.log" "$status" <<'PYCONTROL'
          import json,pathlib,sys
          marker="LOCKED_INSTALL_OBSERVATION "
          lines=pathlib.Path(sys.argv[1]).read_text().splitlines()
          rows=[json.loads(line.split(marker,1)[1]) for line in lines if marker in line and line.split(marker,1)[1].startswith("{")]
          assert len(rows)==2, f"expected two helper observations, found {len(rows)}"
          for row in rows:
              print(f"{row['scenario']}: {row['classification']}, complete={row['complete']}, exit={row.get('actualExit')}")
          assert sys.argv[2]=="0", "helper observation run did not qualify"
          assert {row["scenario"]:row["classification"] for row in rows}=={"N2":"supported","N3":"refused"}
          assert all(row["complete"] and row["meetsRequiredDecision"] for row in rows)
          PYCONTROL
