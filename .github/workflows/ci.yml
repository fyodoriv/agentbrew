name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-perf-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run build
      - name: Check for the file-operation tracer
        run: command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }
      - name: Trace only the fixed command table
        run: python3 scripts/probe-perf-inputs.py
