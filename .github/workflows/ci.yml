name: CI
on:
  push:
    branches: [test/perf-exclusive-receipt-red]
permissions:
  contents: read
env:
  DO_NOT_TRACK: "1"
  AGENTBREW_EVENTS: "0"
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Check the unqualified shared-slot baseline
        run: npx vitest run src/scripts/perf-gate.test.ts -t 'P03 refuses' --maxWorkers=1 --retry=0 --reporter=verbose
