name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-selected-native-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Build the candidate
        run: |
          npm ci
          npm run build
      - name: Measure signed native output in synthetic homes
        id: native
        run: |
          node="$(command -v node)"
          outside_net="$(readlink /proc/self/ns/net)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          stage="$(mktemp -d "${RUNNER_TEMP}/sync-proof.XXXXXXXX")"
          printf 'report=%s\n' "$stage/public-native-observations.ndjson" >> "$GITHUB_OUTPUT"
          npm pack --ignore-scripts --pack-destination "$stage" --silent >/dev/null
          sudo unshare --net --setuid "$runner_uid" --setgid "$runner_gid" \
            /usr/bin/env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 python3 \
            scripts/fixtures/selected-native-proof.py "$node" "$PWD" "$outside_net" \
            "$runner_uid" "$(git rev-parse HEAD)" "$(git rev-parse HEAD)" "$stage"
      - name: Save synthetic change receipts
        if: ${{ always() && steps.native.outputs.report != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-native-observations
          path: ${{ steps.native.outputs.report }}
          if-no-files-found: ignore
