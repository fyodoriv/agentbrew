name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-interruption:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Verify signed process interruption at three checkpoints
        run: |
          umask 022
          npm exec -- vitest run src/plugins/claude-native.test.ts -t 'process loss at output checkpoints' --testTimeout 20000 --maxWorkers 1
