name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Select the preregistered npm
        run: npm install --prefix "$RUNNER_TEMP/qualified-npm" --no-audit --no-fund --ignore-scripts --package-lock=false npm@10.9.9
      - name: Measure frozen locked-install decisions
        run: |
          export LOCKED_INSTALL_OBSERVATION=1
          export LOCKED_INSTALL_OBSERVATION_NPM_CLI="$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js"
          status=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            selected=(src/build-pipeline-guard.test.ts src/worktree-deps.test.ts src/scripts/verify-cache.test.ts)
          else
            selected=(src/worktree-deps.test.ts -t "'N[23]' records physical content and the real helper decision$")
          fi
          npx vitest run "${selected[@]}" --maxWorkers=1 --retry=0 --reporter=default --silent=false > "$RUNNER_TEMP/locked-install-observations.log" 2>&1 || status=$?
          python3 - "$RUNNER_TEMP/locked-install-observations.log" "$status" "$RUNNER_OS" <<'PYCONTROL'
          import collections,json,pathlib,re,sys
          marker="LOCKED_INSTALL_OBSERVATION "
          lines=re.sub(r"\x1b\[[0-9;]*[A-Za-z]","",pathlib.Path(sys.argv[1]).read_text()).splitlines()
          rows=[json.loads(line.split(marker,1)[1]) for line in lines if marker in line and line.split(marker,1)[1].startswith("{")]
          expected={"N2":"supported","N3":"refused"}
          counts={"N2":1,"N3":1}
          if sys.argv[3]=="macOS":
              expected.update({"N1":"refused","N4":"refused","N5":"refused",**{name:"supported" for name in ("P1","P2","P3","P4")}})
              counts={name:(3 if name=="N5" else 1) for name in expected}
          for line in lines:
              if re.match(r"^\s*(?:Test Files|Tests)\s+",line):
                  print(line.strip())
          for row in rows:
              case=row["scenario"]
              assert case in expected
              print(case,row["classification"],"complete",row["complete"],"exit",row.get("actualExit",row.get("guardExit")))
          assert collections.Counter(row["scenario"] for row in rows)==counts
          assert all(row["complete"] and row.get("meetsRequiredDecision",True) and row["classification"]==expected[row["scenario"]] for row in rows)
          assert sys.argv[2]=="0", "selected tests did not pass"
          PYCONTROL
