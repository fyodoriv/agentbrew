name: CI

# The hosted copy of the local gate: `npm run verify`, the same command a
# contributor runs before a push. Hosted on GitHub's standard runners, which
# are free for public repositories. See docs/ci.md.
#
# Safety:
# - No secrets are used. A fork PR gets a read-only token and no secrets.
# - The private-pattern leak gate cannot run here: its pattern file lives
#   only on the owner's machine. The local pre-push gate stays the authority.
# - Steps never print the environment.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never send usage data or event logs from a runner.
  DO_NOT_TRACK: "1"
  AGENTBREW_EVENTS: "0"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: Playwright has no Chromium build
        # for the newer image yet (TASKS.md ci-ubuntu-latest-playwright).
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate compares the branch with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Install test tools
        # git-filter-repo: the test of scripts/sanitize-history.sh needs it.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install git-filter-repo
          else
            # PyPI fallback: a runner DNS failure for the Ubuntu archive
            # must not stop the gate.
            { sudo apt-get update && sudo apt-get install -y git-filter-repo; } ||
              pipx install git-filter-repo
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Restore the gate step cache
        # scripts/verify.sh skips a step whose inputs passed before, like nx.
        # A cache entry cannot be changed, so each run saves a new one and
        # restores the newest. A pull request reads its own entries and
        # main's; it cannot write to main's.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gate-cache
          key: gate-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gate-${{ matrix.os }}-

      - name: Point the gate at the step cache
        run: echo "AGENTBREW_GATE_CACHE_DIR=$RUNNER_TEMP/gate-cache" >> "$GITHUB_ENV"

      - name: Gate (npm run verify)
        run: npm run verify

  inventory-receipt:
    name: inventory receipt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.97.0 fetch --locked --manifest-path rust/Cargo.toml
      - name: Run pure receipt controls
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/inventory-receipt-tests.log"
          cargo +1.97.0 test --locked --offline --manifest-path rust/Cargo.toml --test owner_success_receipt -- --test-threads=1 2>&1 | tee "$log"
          names='complete_record_accepted missing_field_refused unknown_terminal_unqualified unknown_reservation_unqualified unknown_ownership_unqualified invalid_enum_refused private_fields_refused cleanup_outcome_unchanged eperm_success_conflict_unqualified'
          for name in $names; do
            [ "$(grep -Ec "^test $name \.\.\. ok$" "$log")" -eq 1 ]
          done
          grep -Eq '^test result: ok\. 9 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' "$log"

  inventory-guard-compile:
    name: inventory guard compile (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Fetch locked dependencies
        run: |
          cargo +1.97.0 fetch --locked --manifest-path rust/Cargo.toml
          cargo +1.97.0 fetch --locked --manifest-path rust/owner-hosted-fixture/Cargo.toml
      - name: Check compile-only guard
        shell: bash
        run: |
          set -euo pipefail
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
          export CARGO_TARGET_DIR="$RUNNER_TEMP/owner-guard-target"
          python3 rust/tests/hosted_signal_boundary_test.py -v 2>&1 | tee "$RUNNER_TEMP/owner-source-tests.log"
          grep -Eq '^test_boundary_and_distinct_refusal_are_present .* \.\.\. ok$' "$RUNNER_TEMP/owner-source-tests.log"
          grep -Eq '^test_bypass_and_cfg_removal_mutations_are_rejected .* \.\.\. ok$' "$RUNNER_TEMP/owner-source-tests.log"
          grep -Eq '^Ran 2 tests? in ' "$RUNNER_TEMP/owner-source-tests.log"
          rustup run 1.97.0 rustc --test rust/src/owner_guarded_dispatch.rs -o "$RUNNER_TEMP/owner-guard-tests"
          "$RUNNER_TEMP/owner-guard-tests" | tee "$RUNNER_TEMP/owner-guard-tests.log"
          test "$(grep -Ec '^test tests::term_kill_and_drop_retries_never_call_the_syscall \.\.\. ok$' "$RUNNER_TEMP/owner-guard-tests.log")" -eq 1
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' "$RUNNER_TEMP/owner-guard-tests.log"
          rustup run 1.97.0 rustc --test rust/src/owner_hosted_receipt.rs -o "$RUNNER_TEMP/owner-receipt-tests"
          "$RUNNER_TEMP/owner-receipt-tests" | tee "$RUNNER_TEMP/owner-receipt-tests.log"
          names='exact_capacity_is_valid overflow_is_sticky invalidation_refuses_fake_syscall missing_result_is_inconclusive illegal_transition_is_rejected direct_transactional_record_is_rejected invalid_receipt_refuses_cleanup_retries unexpected_admission_is_inconclusive ordinary_observation_then_refusal_is_closed closed_evidence_categories_are_retained unknown_ownership_blocks_later_attempts unproved_reap_after_drop_stays_inconclusive closed_refusal_after_drop_reap_is_diagnostic_only reap_before_drop_is_allowed drop_retry_without_main_attempt_is_allowed missing_final_or_reap_is_inconclusive no_refusal_is_inconclusive early_or_duplicate_finalization_is_inconclusive unknown_ownership_cannot_close_diagnostic duplicate_reap_cannot_close_diagnostic receipt_can_be_claimed_only_once attempt_after_reap_cannot_close_diagnostic pending_attempt_cannot_close_diagnostic empty_or_unclaimed_receipt_is_inconclusive finalization_overflow_is_sticky drop_before_spawn_is_inconclusive reap_before_spawn_is_inconclusive event_after_finalization_is_inconclusive'
          for name in $names; do test "$(grep -Ec "^test tests::$name \\.\\.\\. ok$" "$RUNNER_TEMP/owner-receipt-tests.log")" -eq 1; done
          grep -Eq '^test result: ok\. 28 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' "$RUNNER_TEMP/owner-receipt-tests.log"
          RUSTC="$(rustup which --toolchain 1.97.0 rustc)" python3 rust/tests/hosted_evidence_mapping_test.py | tee "$RUNNER_TEMP/owner-mapping-tests.log"
          grep -Fxq 'closed mapping: 23 cases passed' "$RUNNER_TEMP/owner-mapping-tests.log"
          if cargo +1.97.0 rustc --locked --offline --manifest-path rust/owner-hosted-fixture/Cargo.toml --bin owner-hosted-fixture > "$RUNNER_TEMP/fixture-refusal.log" 2>&1; then exit 1; fi
          grep -Fq 'requires target-scoped owner_hosted_experiment cfg' "$RUNNER_TEMP/fixture-refusal.log"
          cargo +1.97.0 rustc --locked --offline --manifest-path rust/owner-hosted-fixture/Cargo.toml --bin owner-hosted-fixture -- --cfg owner_hosted_experiment --check-cfg 'cfg(owner_hosted_experiment)'
          if cargo +1.97.0 rustc --locked --offline --manifest-path rust/Cargo.toml --lib -- --cfg owner_hosted_experiment > "$RUNNER_TEMP/main-refusal.log" 2>&1; then exit 1; fi
          grep -Fq 'owner_hosted_experiment is forbidden in the main package' "$RUNNER_TEMP/main-refusal.log"
          cargo +1.97.0 check --locked --offline --manifest-path rust/Cargo.toml --lib
