name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-native-facets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      DO_NOT_TRACK: "1"
      AGENTBREW_EVENTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Check the ordinary native publication path
        run: npx vitest run src/plugins/claude-native-ordinary.test.ts --maxWorkers=1 --retry=0
      - name: Check signed native publication and warm receipts
        if: runner.os == 'Linux' && !cancelled()
        run: npx vitest run src/plugins/claude-native.test.ts -t 'scoped native facet publication|native publisher admission|selected native signer commit fence|full native output proof|warm native receipt admission|selected native destination commit observation|cold native receipt coverage' --maxWorkers=1 --retry=0
      - name: Check normal native plugin and launcher compatibility
        if: runner.os == 'Linux'
        run: npx vitest run src/plugins/plugins.test.ts src/plugins/cli-plugin.test.ts src/plugins/claude-native.test.ts src/plugins/mcp-launcher.test.ts --maxWorkers=1 --retry=0
      - name: Verify the candidate types
        if: runner.os == 'Linux'
        run: npm run typecheck
