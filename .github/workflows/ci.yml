name: CI

# The hosted copy of the local gate: `npm run verify`, the same command a
# contributor runs before a push. Hosted on GitHub's standard runners, which
# are free for public repositories. See docs/ci.md.
#
# Safety:
# - No secrets are used. A fork PR gets a read-only token and no secrets.
# - The private-pattern leak gate cannot run here: its pattern file lives
#   only on the owner's machine. The local pre-push gate stays the authority.
# - Steps never print the environment.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never send usage data or event logs from a runner.
  DO_NOT_TRACK: "1"
  AGENTBREW_EVENTS: "0"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate compares the branch with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Gate (npm run verify)
        run: npm run verify
