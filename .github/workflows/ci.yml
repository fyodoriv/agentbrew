name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-interruption:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Measure recursive copy mode under both masks
        run: |
          node --input-type=module - <<'NODE'
          import { chmodSync, cpSync, mkdirSync, mkdtempSync, rmSync, statSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          const stage = mkdtempSync(join(tmpdir(), "queue-copy-"));
          try {
            const source = join(stage, "source");
            mkdirSync(source);
            const guard = join(source, "guard");
            writeFileSync(guard, "synthetic fixture");
            chmodSync(guard, 0o644);
            for (const mask of [0o022, 0o077]) {
              process.umask(mask);
              const target = join(stage, mask.toString(8));
              cpSync(source, target, { recursive: true });
              const mode = statSync(join(target, "guard")).mode & 0o777;
              process.stdout.write("copy-mask=" + mask.toString(8) + " output-mode=" + mode.toString(8) + "\n");
              if (mode !== (0o644 & ~mask)) process.exitCode = 1;
            }
          } finally {
            rmSync(stage, { recursive: true });
          }
          NODE
      - name: Verify signed mode and checkpoint cases
        run: |
          umask 022
          npm exec -- vitest run src/plugins/claude-native.test.ts src/plugins/claude-native-ordinary.test.ts --testTimeout 20000 --maxWorkers 1
