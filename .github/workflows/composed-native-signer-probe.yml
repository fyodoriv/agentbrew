name: Composed native signer probe
on:
  push:
    branches: [test/composed-native-dotfiles-signer]
permissions:
  contents: read
jobs:
  signer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fyodoriv/dotfiles
          ref: e76d872f7761fb84480860694fb97458e6122b07
          path: fixture-dotfiles
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Install Dotfiles CLI prerequisites
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -qy jq yq
          elif ! command -v jq >/dev/null || ! command -v yq >/dev/null; then
            brew install jq yq
          fi
      - run: npm ci
      - name: Observe actual cross-tool signer writes
        env:
          DOTFILES_SIGNER_FIXTURE: ${{ github.workspace }}/fixture-dotfiles
        run: |
          umask 022
          npx --no-install vitest run src/plugins/claude-native.test.ts --reporter=verbose -t 'composed native and Dotfiles signer order'
