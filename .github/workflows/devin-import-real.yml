name: Devin Import (real-tier)

# Slow-tier regression test for the bare-placeholder crash class.
#
# The fast tier (`simulateDevinImport` in src/mcp/devin-import.simulator.ts)
# runs on every commit via the normal vitest suite. This workflow closes
# the loop by running the REAL Devin CLI against fixtures generated from
# MCP_AGENT_MATRIX and asserting Devin's strict-interpolation MCP loader
# doesn't crash. If the fast-tier simulator ever drifts from Devin's
# actual behavior, this workflow surfaces the divergence loudly.
#
# Triggered:
#   - workflow_dispatch (manual)
#   - schedule (nightly at 09:00 UTC = 05:00 ET / 04:00 CT — quiet hours)
#   - pull_request labeled with `mcp-devin` (opt-in for PRs that touch
#     resilient-sweep, env-vars, or agent-matrix code)
#
# Skip semantics: if the Devin CLI can't be installed in the runner
# environment, the script exits with code 77 (autotools "skip"). The
# workflow treats that as success but uploads a clear marker in the log
# so we can see when the slow tier hasn't actually run in months.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches: [main]

jobs:
  devin-import-real:
    # Skip on PR events unless the `mcp-devin` label is present. Label-gated
    # runs let contributors opt-in when their PR touches the relevant code.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'mcp-devin')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Devin CLI (best-effort)
        id: install-devin
        # Devin's installer is curl|bash from cli.devin.ai. If it fails (network,
        # 404, etc.), the script exits with code 77 and the workflow skips
        # gracefully. We never silently succeed without running Devin.
        run: |
          set -euo pipefail
          INSTALLER_URL="${DEVIN_INSTALLER_URL:-https://cli.devin.ai/install.sh}"
          if curl -fsSL "$INSTALLER_URL" -o /tmp/devin-install.sh 2>/tmp/devin-install.err; then
            bash /tmp/devin-install.sh < /dev/null > /tmp/devin-install.out 2>&1 || true
            DEVIN_BIN_PATH="$HOME/.local/share/devin/cli/_versions/current/bin/devin"
            if [ -x "$DEVIN_BIN_PATH" ]; then
              echo "DEVIN_BIN=$DEVIN_BIN_PATH" >> "$GITHUB_ENV"
              echo "installed=true" >> "$GITHUB_OUTPUT"
              "$DEVIN_BIN_PATH" --version
            else
              echo "Devin installer ran but binary not found at $DEVIN_BIN_PATH"
              echo "installer-output:" && cat /tmp/devin-install.out || true
              echo "installed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Could not fetch Devin installer from $INSTALLER_URL"
            cat /tmp/devin-install.err || true
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run real-tier import test (post-sweep)
        # Always run — the script gracefully skips with exit 77 if Devin is missing.
        # The slow-tier failure mode is "Devin crashes despite the sweep" (exit 1).
        env:
          # Crash-prone env vars must be UNSET for the test to model the user's
          # original symptom. Use --unset semantics in the step env if anything
          # leaks them from CI secrets.
          GITHUB_TOKEN: ""
          GITHUB_PERSONAL_ACCESS_TOKEN: ""
          SLACK_BOT_TOKEN: ""
          SLACK_USER_TOKEN: ""
          JIRA_API_TOKEN: ""
        run: |
          set -uo pipefail
          npm run test:devin-import-real
          status=$?
          if [ $status -eq 77 ]; then
            echo "::warning::Devin CLI not available in this runner — slow-tier test SKIPPED."
            exit 0
          elif [ $status -ne 0 ]; then
            echo "::error::Real Devin's MCP loader crashed against swept fixtures — the resilient sweep has a regression."
            exit $status
          fi
          echo "Real-tier test passed: real Devin imports every peer config cleanly."

      - name: Self-test (verify the test catches regressions)
        # Run the script with the sweep disabled. Exit 1 here is the expected
        # outcome — proves the test would actually catch a future regression.
        # If exit IS 0, the test is broken: it's not detecting the crash class.
        if: steps.install-devin.outputs.installed == 'true'
        env:
          DEVIN_REAL_TIER_SKIP_SWEEP: "1"
          GITHUB_TOKEN: ""
          GITHUB_PERSONAL_ACCESS_TOKEN: ""
          SLACK_BOT_TOKEN: ""
          SLACK_USER_TOKEN: ""
          JIRA_API_TOKEN: ""
        run: |
          set -uo pipefail
          npm run test:devin-import-real
          status=$?
          if [ $status -eq 1 ]; then
            echo "Self-test passed: script correctly DETECTS regressions when sweep is disabled."
            exit 0
          fi
          echo "::error::Self-test FAILED. Script returned $status when sweep was disabled — should have been 1 (regression detected)."
          exit 1
