name: Synthetic memory lock trial

on:
  pull_request:
    paths:
      - .github/workflows/memory-lockf-trial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockf-owner-crash:
    runs-on: macos-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test owner crash on scratch file
        shell: bash
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import select
          import subprocess
          import tempfile

          script = '''const fs = require("node:fs");
          const cp = require("node:child_process");
          const fd = fs.openSync(process.argv[1], "w+", 0o600);
          const result = cp.spawnSync("/usr/bin/lockf", ["-t", "0", "3"],
            {stdio: ["ignore", "ignore", "ignore", fd], timeout: 10000});
          if (result.status !== 0) process.exit(2);
          process.stdout.write(process.version + "\\n");
          setInterval(() => {}, 1000);'''
          with tempfile.TemporaryDirectory(prefix="agentbrew-lock-crash-") as tmp:
              path = str(pathlib.Path(tmp) / "coordination.lock")
              owner = subprocess.Popen(["node", "-e", script, path], stdout=subprocess.PIPE, text=True)
              try:
                  if not select.select([owner.stdout], [], [], 15)[0]:
                      raise RuntimeError("owner did not respond")
                  version = owner.stdout.readline().strip()
                  print("owner version:", version, flush=True)
                  if not version.startswith("v" + os.environ["EXPECTED_NODE_MAJOR"] + "."):
                      raise RuntimeError("unexpected owner runtime")
                  command = ["/usr/bin/lockf", "-k", "-t", "0", path, "/usr/bin/true"]
                  before = subprocess.run(command, capture_output=True, timeout=10).returncode
                  if before != 75:
                      raise RuntimeError("rival did not encounter contention")
                  owner.kill()
                  owner.wait(timeout=10)
                  after = subprocess.run(command, capture_output=True, timeout=10).returncode
                  print("rival while held:", before, "after owner death:", after, flush=True)
                  if after != 0:
                      raise RuntimeError("lock survived owner death")
              finally:
                  if owner.poll() is None:
                      owner.kill()
                      owner.wait(timeout=10)
          PY

  lockf-descriptor:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Test descriptor ownership on scratch file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory(prefix="agentbrew-lockf-") as tmp:
              path = pathlib.Path(tmp) / "coordination.lock"
              fd = os.open(path, os.O_CREAT | os.O_RDWR, 0o600)
              try:
                  first = subprocess.run(["/usr/bin/lockf", "-t", "0", str(fd)], pass_fds=(fd,), capture_output=True, timeout=10)
                  second = subprocess.run(["/usr/bin/lockf", "-k", "-t", "0", str(path), "/usr/bin/true"], capture_output=True, timeout=10)
                  print("descriptor acquisition:", first.returncode, "competitor while held:", second.returncode, flush=True)
                  if first.returncode != 0 or second.returncode != 75:
                      raise RuntimeError("descriptor failed to exclude competing process")
              finally:
                  os.close(fd)
              third = subprocess.run(["/usr/bin/lockf", "-k", "-t", "0", str(path), "/usr/bin/true"], capture_output=True, timeout=10)
              print("competitor after close:", third.returncode, flush=True)
              if third.returncode != 0:
                  raise RuntimeError("descriptor lock did not release")
              print("PASS synthetic descriptor lock", flush=True)
          PY
