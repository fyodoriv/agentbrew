# Agentfile — repo-local agentbrew development config
# Project Agentfiles are additive: they register the tools this repo needs,
# while the global Agentfile remains the portable machine-wide source of truth.
# Validate with `npm run dev -- lint`; deploy intentionally with
# `agentbrew sync --agentfile ./Agentfile.yaml`.

# No mcp: list. MCP servers are a per-person choice; add them with
# `agentbrew install <name>` or your global Agentfile.

skills:
  - agentfile-init
  - next-task
  - project-audit
  - report-upstream
  - sync-agent-config
  - task-command-center
  - writing-plans
  - wrap-up

sources:
  - ./skill-plugins/workflow
  - ./skill-plugins/dev

# /agentbrew starts agentbrew in an agent (it runs bare `agentbrew`). It also
# ships built in; this line deploys a checkout's edits.
commands:
  - ./commands
