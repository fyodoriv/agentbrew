- description: failing claude-code chat output reports its rule gap
  vars:
    artifact_path: agent-artifact-evals/plain-language/failing/claude-code--chat.md
    evaluator: plain-language
    surface: chat
  metadata:
    artifact: agent-artifact-evals/plain-language/failing/claude-code--chat.md
    agent: claude-code
    surface: chat
    tier: deterministic
  assert:
    - type: contains
      value: "FAIL agent-artifact-evals/plain-language/failing/claude-code--chat.md"
    - type: contains
      value: 'diagnostic answer-not-first rule="put the answer first"'
    - type: contains
      value: 'diagnostic long-sentence rule="short, direct sentences"'

