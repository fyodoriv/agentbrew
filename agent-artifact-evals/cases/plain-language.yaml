    evaluator: plain-language
    surface: chat
  metadata:
    artifact: agent-artifact-evals/plain-language/samples/claude-code/chat.md
    agent: claude-code
    surface: chat
    tier: deterministic
  assert:
    - type: contains
      value: "PASS agent-artifact-evals/plain-language/samples/claude-code/chat.md"
    - type: contains
      value: 'diagnostic_count=0'

