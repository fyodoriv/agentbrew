# agentbrew hooks — canonical manifest
#
# Source-of-truth for deterministic primary-agent hooks. Each entry maps a
# hook script to a Claude Code event + matcher pair. agentbrew sync reads
# this file, deploys the referenced script to ~/.claude/codeassist/hooks-scripts/,
# and writes equivalent entries into each listed agent's hooks file.
#
# **Layering**: this canonical manifest can be overridden / extended per-
# machine via `~/.config/agentbrew/hooks-overlay/manifest.yaml`. Overlay
# entries with the same `id` REPLACE canonical entries (use for local
# tuning). Overlay's `disabled:` field lists canonical IDs to skip on
# this machine (use for explicit opt-out — every skip is logged to
# hook-decisions.jsonl with `reason: "disabled-by-overlay"` so drift is
# visible). Overlay's `enabled:` field is the mirror: it lists
# `defaultEnabled: false` IDs to turn on for this machine. When an ID is in
# both lists, `disabled:` wins.
#
# **Opt-in hooks**: the PreToolUse:Bash hooks and context-budget-measure
# ship with `defaultEnabled: false`. Each Bash hook runs on every Bash call,
# so enable them one machine at a time and measure the latency first.
#
# **Schema** (per hook):
#   id              kebab-case unique identifier
#   description     one-line human description
#   event           Claude Code event: PreToolUse | PostToolUse | UserPromptSubmit | Stop | SubagentStop | SessionStart | SessionEnd | PreCompact | Notification
#   matcher         optional Claude Code matcher (e.g. "Write|Edit", "Bash"). Omit to match all.
#   script          path relative to agentbrew/hooks/ (e.g. checks/code-no-timestamps.sh)
#   tier            "deterministic" (Cat A) or "verifier" (Cat B)
#   verdict         "block" (exit 2) | "warn" (stderr only) | "mutate" (rewrite tool_input)
#   bypassEnvVar    optional env var that disables this hook (default: HOOK_BYPASS_<ID_UPPERCASE>)
#   model           Cat B only — overrides default `claude-sonnet-4-7`
#   promptVersion   Cat B only — bump when the verifier prompt changes; logged with each decision
#   sourceRule      reference to the original IRON LAW (file:line) the hook implements
#   agents          which agents to deploy to. Cursor gets event-name transforms.
#   defaultEnabled  optional; false makes the hook opt-in. Its script still deploys, but sync wires it into
#                   agent hooks files only when the overlay lists its id under `enabled:`. Omit to keep it on.
#
# **Adding a hook**: copy an existing entry below, change the id, write
# the script under checks/ or verifiers/, ship a .test.sh fixture, add
# the corresponding rule-deletion follow-up task in TASKS.md per the
# hooks-phase-1 / hooks-phase-2 discipline.

version: 1

hooks:
  # ── Phase 0 golden-path proof (ships with foundation) ──────────────────
  - id: code-no-timestamps
    description: Reject Write|Edit that adds a literal date-stamp comment to source code
    event: PreToolUse
    matcher: Write|Edit
    script: checks/code-no-timestamps.sh
    tier: deterministic
    verdict: block
    sourceRule: shared-rules.md:826 — "Code Has No Time Stamps (IRON LAW)"
    agents: ["claude-code", "cursor"]

  # ── Phase 1 hooks (dotfiles wrapper migration — sourceRule = dotfiles/bin/gh + git-hooks/commit-msg) ──

  - id: gh-pr-body-attribution
    description: Strip foreign agent attribution from gh pr create/edit body + append canonical Fyodor footer
    event: PreToolUse
    matcher: Bash
    script: checks/gh-pr-body-attribution.sh
    tier: deterministic
    verdict: mutate
    sourceRule: dotfiles/bin/gh (formalized as hook 2026-05-27) + shared-rules.md:1283 "Agent Attribution Footer (ABSOLUTE)"
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: gh-pr-body-requires-rationale
    description: Block gh pr create/edit when body lacks a "why this is needed" rationale
    event: PreToolUse
    matcher: Bash
    script: checks/gh-pr-body-requires-rationale.sh
    tier: deterministic
    verdict: block
    sourceRule: shared-rules.md:504 "PR Format (canonical structure + brevity is IRON LAW)" + dotfiles/bin/gh
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: gh-pr-body-requires-validation
    description: Block gh pr create/edit when body lacks validation sections (full block or stacked-skill Summary+Delivery plan+Test plan trio)
    event: PreToolUse
    matcher: Bash
    script: checks/gh-pr-body-requires-validation.sh
    tier: deterministic
    verdict: block
    sourceRule: task-command-center skill "PR validation block (IRON LAW)" + templates/AGENTS.md
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: gh-pr-skill-requires-evals
    description: Block skill PRs that add SKILL.md without evals/evals.json and eval-result sections
    event: PreToolUse
    matcher: Bash
    script: checks/gh-pr-skill-requires-evals.sh
    tier: deterministic
    verdict: block
    sourceRule: templates/AGENTS.md "Skill PRs Must Ship Evals (IRON LAW)" + Anthropic skill-creator / Superpowers writing-skills
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: gh-pr-agent-artifacts-require-tests
    description: Block agent-artifact PRs without same-PR tests, evals, or exemption reason
    event: PreToolUse
    matcher: Bash
    script: checks/gh-pr-agent-artifacts-require-tests.sh
    tier: deterministic
    verdict: block
    bypassEnvVar: HOOK_BYPASS_GH_PR_AGENT_ARTIFACTS_REQUIRE_TESTS
    sourceRule: templates/AGENTS.md "Agent Artifact PRs Need Evidence" + src/agent-artifacts/inventory.ts
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: git-commit-conventional
    description: Block git commit -m with non-conventional-commit format (header type colon space)
    event: PreToolUse
    matcher: Bash
    script: checks/git-commit-conventional.sh
    tier: deterministic
    verdict: block
    sourceRule: dotfiles/git-hooks/commit-msg (formalized as hook 2026-05-27)
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: git-strip-agent-attribution
    description: Strip foreign agent Co-Authored-By + Generated-with trailers from git commit -m
    event: PreToolUse
    matcher: Bash
    script: checks/git-strip-agent-attribution.sh
    tier: deterministic
    verdict: mutate
    sourceRule: dotfiles/git-hooks/commit-msg + dotfiles/lib/strip-agent-attribution.sh
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: no-git-add-all
    description: Block git add -A or git add . in multi-agent contexts (stages other agents' work)
    event: PreToolUse
    matcher: Bash
    script: checks/no-git-add-all.sh
    tier: deterministic
    verdict: block
    sourceRule: shared-rules.md "Git Safety (Multi-Agent)" + agentbrew/AGENTS.md
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: no-force-push-protected
    description: Block git push --force / --force-with-lease to main / master / develop
    event: PreToolUse
    matcher: Bash
    script: checks/no-force-push-protected.sh
    tier: deterministic
    verdict: block
    sourceRule: shared-rules.md "Git Safety (Multi-Agent)"
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: no-commit-no-verify
    description: Block git commit --no-verify (skipping commit hooks is forbidden by policy)
    event: PreToolUse
    matcher: Bash
    script: checks/no-commit-no-verify.sh
    tier: deterministic
    verdict: block
    sourceRule: agentbrew/TASKS.md policy "do NOT bypass commit hooks (--no-verify)" + dotfiles/TASKS.md
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

