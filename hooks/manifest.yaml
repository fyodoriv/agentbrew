    sourceRule: templates/AGENTS.md:370 "Never Commit Screenshots to Repos (IRON LAW)" + templates/AGENTS.md:396 "Don't Screenshot Test Output (IRON LAW)"
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

