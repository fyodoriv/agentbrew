    bypassEnvVar: HOOK_BYPASS_CODIFY_REPEATED_WORK
    model: claude-haiku-4-5
    promptVersion: 1
    sourceRule: 'shared-rules.md:187 Codify before continuing — write skill'
    agents: ["claude-code", "cursor"]

