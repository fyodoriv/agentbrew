    verdict: warn
    bypassEnvVar: HOOK_BYPASS_BROWSER_ERRORS_BEFORE_DONE
    model: claude-haiku-4-5
    promptVersion: 1
    sourceRule: 'shared-rules.md:79 Zero Browser Errors Before Frontend Done'
    agents: ["claude-code", "cursor"]

