    tier: deterministic
    verdict: block
    sourceRule: shared-rules.md "Never lead with cross-PR navigation; put Related PRs near the bottom"
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: async-human-comms-blocks
    description: Block mutating tool calls when ask_human.md in repo has status PENDING
    event: PreToolUse
    script: checks/async-human-comms-blocks.sh
    tier: deterministic
    verdict: block
    sourceRule: shared-rules.md:135 "Async human comms — ask_human.md (ADOPTED CONVENTION, IRON LAW)"
    agents: ["claude-code", "cursor"]

  - id: comment-adjacency
    description: Warn on orphaned comments (blank line between doc and code)
    event: PostToolUse
    matcher: Write|Edit
    script: checks/comment-adjacency.sh
    tier: deterministic
    verdict: warn
    sourceRule: shared-rules.md:432 "Comment Adjacency (IRON LAW)"
    agents: ["claude-code", "cursor"]

  - id: cross-team-code-batch
    description: Warn on gh pr create when diff touches 2+ CODEOWNER teams without BATCH prefix
    event: PreToolUse
    matcher: Bash
    script: checks/cross-team-code-batch.sh
    tier: deterministic
    verdict: warn
    sourceRule: shared-rules.md:311 "Cross-Team Code Touches Batch (HIGHEST PRIORITY IRON LAW)"
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: env-correct-urls
    description: Warn when PR title mentions env (staging/prod) but body has different env's URL
    event: PreToolUse
    matcher: Bash
    script: checks/env-correct-urls.sh
    tier: deterministic
    verdict: warn
    sourceRule: shared-rules.md:811 "Env-Correct URLs (IRON LAW)"
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  # ── Phase 2 Cat B verifier hooks (warn-mode observation first) ──────────

  - id: pr-body-diff-consistency
    description: Warn when a gh pr edit body appears stale relative to the current diff
    event: PreToolUse
    matcher: Bash
    script: verifiers/pr-body-diff-consistency.sh
    tier: verifier
    verdict: warn
    bypassEnvVar: HOOK_BYPASS_PR_BODY_DIFF_CONSISTENCY
    model: claude-haiku-4-5
    promptVersion: 1
    sourceRule: 'shared-rules.md:600 PR Bodies Decay — Verify Before Edit'
    agents: ["claude-code", "cursor"]
    defaultEnabled: false

  - id: codify-repeated-work
    description: Warn when repeated workflow work should be codified into a skill before continuing
    event: UserPromptSubmit
    script: verifiers/codify-repeated-work.sh
