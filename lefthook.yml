# Git hooks for agentbrew, run via the shared lefthook wrappers in the repo's
# git-hooks dir (core.hooksPath). lefthook must be on PATH or resolvable in
# node_modules for these to fire — see AGENTS.md "Global git hooks".
#
# pre-push: run public-release privacy checks on the working checkout.
# The same OSS checks run on the change's hosted checkout before merge.
#
# lockfile-sync: block a push whose package.json and package-lock.json
# disagree for npm 10 (`npm ci` would fail for npm 10 users). It runs only
# when a pushed commit touches a package file; about 1 s with npm 10 cached.
pre-push:
  commands:
    oss-readiness:
      run: npm run check:oss
    lockfile-sync:
      glob: "{package.json,package-lock.json}"
      run: bash scripts/check-lockfile-sync.sh
