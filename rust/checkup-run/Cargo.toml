[package]
name = "checkup-run"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
