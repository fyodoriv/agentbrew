[package]
name = "page-error-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lib]
name = "migration_check"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "=1.48.0", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
