# Git hooks (https://github.com/evilmartians/lefthook). scripts/setup.sh installs them
# when lefthook is on PATH. Cheap checks first; keep pre-push under 10 seconds.
pre-commit:
  commands:
    secrets:
      run: if command -v gitleaks >/dev/null 2>&1; then gitleaks git --staged --no-banner --redact -l warn; fi
    docs:
      run: scripts/check-docs.sh
pre-push:
  commands:
    fast-gate:
      run: scripts/check.sh fast
