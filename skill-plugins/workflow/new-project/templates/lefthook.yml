# Git hooks (https://github.com/evilmartians/lefthook). scripts/setup.sh installs them
# when lefthook is on PATH. `piped: true` runs commands in order and stops at the first
# failure, so the toolchain check runs first. Keep pre-push under 10 seconds.
pre-commit:
  piped: true
  commands:
    toolchain:
      priority: 1
      run: scripts/check-toolchain.sh
    secrets:
      run: if command -v gitleaks >/dev/null 2>&1; then gitleaks git --staged --no-banner --redact -l warn; fi
    docs:
      run: scripts/check-docs.sh
pre-push:
  piped: true
  commands:
    fast-gate:
      run: scripts/check.sh fast
