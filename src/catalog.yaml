# catalog.yaml — generic, machine-agnostic catalog of skills, MCP servers,
# rules, and CLI tools. Loaded on EVERY machine regardless of team-overlay state.
#
# ── What this is ─────────────────────────────────────────────────────────
# A curated index of best-in-class agent tooling that benefits any
# developer using AI coding agents. Each skill / MCP server entry is
# a REFERENCE — content lives in its source repo, not in agentbrew.
# Updates propagate via `agentbrew sync --pull`. The catalog curates and
# promotes; it never duplicates content. (Curator, not host — see
# docs/VISION.md.)
#
# `recommended: true`  = Tier 1 (every developer benefits).
# `recommended: false` = Tier 2/3 (strong or specialized).
#
# CLI-over-MCP philosophy: CLI commands (synced to
# ~/.config/agentbrew/commands/) work with all configured agents via shell access.
# MCP servers only work with MCP-capable agents (15+). Use MCP when it
# provides a meaningfully better experience (streaming, structured tool
# calls, persistent connections). Otherwise, CLI first.
#
# ── Decision tree: this file vs team-overlay catalogs ────────────────────
# Is the skill / MCP server authored inside a specific organization,
# referencing internal systems (private hostnames, internal APIs,
# org-specific MCP endpoints)?
#   YES → it belongs in a team overlay repo's `catalog-overlay.yaml`,
#         NOT here. See docs/user-stories/27-team-overlay.md for how
#         team overlays declare additional catalog entries via the
#         overlay Agentfile's `catalogOverlay:` field. Such entries
#         are only visible when `agentbrew team set <overlay-url>` is
#         active.
#   NO  → add HERE. Source is a public repo or a generic built-in pointer.
#         Visible to every user regardless of any active team overlay.
# Never mix. An org-specific entry in this file violates AGENTS.md rule #8
# and breaks the OSS-readiness invariant enforced by
# `src/oss/no-internal-refs.test.ts` (which lint-enforces zero company-specific
# identifiers outside an explicit allowlist).
#
# ── `source: built-in` is reserved for agentbrew-specific skills ──────────
# Skills that document agentbrew itself may live under `skill-plugins/dev/`.
# Generic methodology and engineering skills point at their upstream or
# personal source repository. The catalog never hosts a second copy of those
# skills. See AGENTS.md rule #8a and `skill-plugins/dev/README.md`.
#
# ── Maintenance procedures ───────────────────────────────────────────────
# Add a new generic skill:
#   1. Confirm SKILL.md exists on the source repo's main branch.
#   2. Add an entry below under skills: with name, description (include
#      "Don't use for X"), source (owner/repo on github.com OR built-in
#      ONLY for skills that document agentbrew itself), category,
#      recommended, rationale (required if recommended: true).
#   3. Run `npx vitest run src/catalog/`.
#   4. Commit with a project ticket.
#
# Add or promote a recommended MCP server:
#   1. Pick a cheap read-only `tools/call` from the server's actual
#      `tools/list` schema.
#   2. Add `smokeCall: { tool, arguments? }` to the MCP entry. This powers
#      `agentbrew mcp probe --deep`; the 30-min auto-heal scheduler also uses
#      it unless the entry sets `probe: fast` for side-effectful smoke calls.
#   3. Run `npm run dev -- lint` — it fails if a recommended MCP lacks
#      `smokeCall.tool`.
#
# Promote (recommended: false → true): edit the entry in place + add
# rationale. Demote: flip the bool, drop the rationale. Remove: delete
# the YAML block; if users might have it installed, add a P3 note in
# TASKS.md for release communication.
#
# ── Verify your change didn't break team-overlay merging ─────────────────
#   npx vitest run src/catalog/
#   agentbrew team unset && agentbrew catalog --json | jq '.skills | length'
#   agentbrew team set <overlay-url> && agentbrew catalog --json | jq '.skills | length'
# First count = this file only. Second count = this file + overlay
# additions. Same-name overlay overrides don't change the count. If
# either surprises you, the change has leaked org-specific behaviour into
# shared code or vice-versa.

