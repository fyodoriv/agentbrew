# ── cli_tools ────────────────────────────────────────────────────────────
# External CLI binaries (jenkins, gh, ...) that ship pre-built slash
# commands for agents. Each entry points at a directory under
# `src/cli-commands/<name>/` containing one `<command>.md` file per
# `commands:` value. `agentbrew install <name>` copies those files into
# `~/.config/agentbrew/commands/` and prompts the user to set any
# `env` vars (with `setup:` instructions if provided). Use this for
# tools that benefit from a shared command vocabulary across all configured
# agents — anything richer (streaming / structured tool calls /
# persistent connection) belongs under `mcp_servers:` instead.
cli_tools:
  - name: storybook-screenshot
    description: "Slash command and binary for capturing Storybook stories with Playwright."
    category: dev-tooling
    recommended: false
    rationale: "Restores a cross-agent visual-iteration workflow without reviving deleted bosun paths."
    note: "Requires Storybook to be running and Playwright to be installed in the target repo."
    commands:
      - storybook-screenshot

  - name: jenkins-cli
    description: "Slash commands that wrap the Jenkins REST API — `/jenkins-status` and `/jenkins-log`."
    category: cicd
    recommended: false
    rationale: "Lets every agent triage Jenkins failures via a shared command vocabulary, without depending on the optional `jenkins` MCP server."
    note: "Pairs with the `jenkins` MCP server (above). Use `agentbrew install jenkins-cli` for slash commands only, `agentbrew install jenkins` for MCP."
    commands:
      - jenkins-status
      - jenkins-log
    env:
      JENKINS_URL: "${JENKINS_URL}"
      JENKINS_USER: "${JENKINS_USER}"
      JENKINS_API_TOKEN: "${JENKINS_API_TOKEN}"
    setup:
      JENKINS_URL:
        description: "Base URL of your Jenkins server (e.g. https://jenkins.example.com)."
      JENKINS_USER:
        description: "Your Jenkins username — typically the same as your GitHub / corporate username."
      JENKINS_API_TOKEN:
        description: "Personal API token from your Jenkins user profile."
        steps:
          - "Open <JENKINS_URL>/me/configure in a browser and log in."
          - "Click 'Add new token' under the API Token section."
          - "Name it 'agentbrew-cli', click 'Generate', and copy the value."

rules:
  - name: conventional-commits
    description: Enforce conventional commit format
    category: git
    recommended: true
    rationale: "Machine-parseable commit messages enable changelogs, versioning, and CI automation."
    content: |
      Use conventional commits (`feat:`, `fix:`, `docs:`, `refactor:`, `test:`, `chore:`); keep headers ≤72 characters and add a ticket when available.

  - name: test-before-commit
    description: Always run tests before committing
    category: testing
    recommended: true
    rationale: "The single most effective quality gate. Prevents shipping broken code."
    content: |
      Run tests before each commit; use red/green TDD for bugs. See shared-rules **## Verification**.

  - name: minimal-changes
    description: Prefer minimal, focused edits
    category: code-quality
    recommended: true
    rationale: "Focused edits are easier to review, less likely to break, and simpler to revert."
    content: |
      Smallest change that satisfies the request. See shared-rules **## Scope discipline**.

  - name: modern-cli-cohort
    description: Prefer the modern Rust/Go CLI cohort over POSIX defaults
    category: shell-tools
    recommended: true
    rationale: "POSIX defaults (find/grep/sed/curl/top/du/ps/xxd/man) are slow, ignore .gitignore, and don't have the ergonomics of the 2024-2026 Rust/Go cohort. Agents should prefer the modern tool when both are installed."
    content: |
      Prefer installed modern tools: fd/rg/sd/bat/eza over find/grep/sed/cat/ls; jq/yq, gh, zoxide, delta, xh, and lazygit for structured data, GitHub, cd, diff, HTTP, and Git TUI.

      Fall back to POSIX when unavailable, in `/bin/sh` or CI, or while editing POSIX-only code; use `tldr` for unfamiliar tools.

  - name: verify-before-completion
    description: No completion claims without fresh verification evidence
    category: quality
    recommended: true
    rationale: "Agents must prove their work. Evidence before assertions prevents false claims."
    content: |
      No completion claims without fresh verification. See shared-rules **## Verification**.

  - name: tasks-md-spec
    description: "Follow the tasks.md spec (tasks.md) when reading or writing TASKS.md files"
    category: task-management
    recommended: true
    rationale: "Consistent task format enables multi-agent coordination and tooling."
    content: |
      TASKS.md follows tasks.md spec — see shared-rules **## Task queues**. Lint with `npx @tasks-md/lint TASKS.md`.

  - name: public-impersonation-ban
    description: "Block agents from posting anything in public under the user's account without explicit per-action approval"
    category: collaboration
    recommended: true
    rationale: "Agents posting as the user without approval causes real confusion and real harm. Approval must be per-action, not per-session, and never carries over between sessions."
    content: |
      No public posts/comments/reviews as the user without per-action approval; `gh pr create`/`gh pr edit` require it, except `/ship-it` for approved tooling/oncall delivery. Approved PRs need a why-needed rationale and `agent-attribution-footer`.

  - name: load-project-context
    description: "On entering any repo, scan for and load canonical project docs (vision, architecture, roadmap, user stories, competitors) into working context."
    category: context
    recommended: true
    rationale: "Agents working in a project without its vision, architecture, and roadmap context produce drift — they reinvent solved problems, propose features that contradict strategy, and miss user-story constraints. Treating canonical docs as mandatory session context is the cheapest fix and the dominant 2026 pattern (AGENTS.md @-imports + cross-agent rules + SessionStart hooks)."
    content: |
      Before non-trivial work: `bash ~/.config/agentbrew/scripts/load-project-context.sh` — read listed files to depth 2. See shared-rules **## Session entry**.

  - name: pr-vision-trace
    description: "Add `## Vision trace` to PR bodies only when the repo has adopted the pr-vision-trace CI gate — never on enterprise GHE product repos."
    category: quality
    recommended: true
    rationale: "The `load-project-context` rule loads VISION/user-story context for reasoning, but most repos — especially enterprise GHE product repos — do not run the pr-vision-trace CI gate. Agents were polluting those PRs with Vision trace sections copied from minsky-style templates. This rule scopes Vision trace to repos that explicitly adopted `scripts/check-pr-vision-trace.mjs` + `.github/workflows/pr-vision-trace.yml`."
    content: |
      Add `## Vision trace` only if root has pr-vision-trace CI gate (check script or workflow). Otherwise omit; enterprise GHE cites Jira. See shared-rules **## Session entry**.
  - name: agent-attribution-footer
    description: "Require a tool-neutral attribution footer on every agent-authored prose posted under the user's account"
    category: collaboration
    recommended: true
    rationale: "Readers shouldn't have to guess whether a human or an agent wrote a Slack message, PR comment, commit, or Jira ticket posted under the user's name. A small tool-neutral footer disambiguates up-front without binding the user's identity to whichever specific agent happened to run the command (Devin, Windsurf, Claude, Cursor, etc.)."
    content: |
      Agent-authored public prose under the user's account ends with:
          ---
          _🤖 Written by an agent, not {{ user_name }}. Ping me if this looks off._

      Required on GitHub PR descriptions/comments/reviews, Jira/Slack/email, and commit message bodies; omit code, titles, subjects, local notes.

      NO TOOL-SPECIFIC ATTRIBUTION: never `Generated with [Devin]`, `Co-Authored-By: Devin`, or any tool-specific footer.

