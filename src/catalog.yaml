  - name: project-audit
    description: "Deep audit across four lenses: no-brainer fixes, stability gaps, dependency modernization, documentation drift."
    source: fyodoriv/dev-skills
    category: quality
    recommended: true
    rationale: "Finds work when the queue is empty. Every repo has hidden debt."

  - name: git-diagnose-codebase
    description: "Reads any unfamiliar codebase's git history in 5 minutes — runs five `git log` commands (churn, bus factor, bug clusters, velocity, firefighting) plus the churn × bug-keyword cross-reference that surfaces highest-risk files. Used as Step 0 by `project-audit`, `sweep`, and `strategic-review`. Don't use for code review or implementing fixes."
    source: fyodoriv/dev-skills
    category: quality
    recommended: true
    rationale: "Onboarding to an unfamiliar repo, or starting any audit, costs minutes instead of hours when the first thing you do is read git history. Microsoft Research (2005) showed relative code churn predicts defect density; Tornhill's _Your Code as a Crime Scene_ extended this to bug-keyword × churn cross-reference. The 5-minute output biases the rest of the audit toward the highest-risk files instead of arbitrary ones."

  - name: strategic-review
    description: "Deep strategic review of architecture, direction, and fitness. Scans code for structural signals, asks targeted questions, produces recommendations on pivots, architecture changes, and build/buy/kill."
    source: fyodoriv/dev-skills
    category: quality
    recommended: true
    rationale: "Architecture review — when to pivot, what to kill, build vs buy."

  - name: aggressive-cut
    description: "Brutal-honest moat audit + staged aggressive deletion of a codebase that has outgrown its 1-FTE maintenance budget. Codified from the 2026-05-24 Minsky Path A pivot (70K → 7K LOC)."
    source: built-in
    category: quality
    recommended: false
    rationale: |
      Solo-maintained projects accumulate code faster than the operator can maintain it. The 1-FTE sustainable
      LOC budget is ~5-10K; many projects pass that without realising. This skill operationalises the
      "brutal-honest moat audit + staged deletion with parity-test-before-delete" pattern that shipped Minsky's
      Path A pivot. Use it before any major rewrite — if 80%+ of the codebase is reproducible from existing OSS
      composed with a thin shell, the rewrite is "delete + write the shell", not "build a v2 from scratch".
      Sequels strategic-review (which decides whether to pivot) — once the answer is "yes, cut", this skill
      runs the cut with parity-test-before-delete discipline.

