mcp_servers:
  # ── Recommended ─────────────────────────────────────────────────

  - name: context7
    description: "Live library/framework docs via @upstash/context7-mcp — no API key for the public Upstash-hosted service. Deploys to every MCP-capable agent through agentbrew sync, not only Cursor marketplace."
    command: npx
    args: ["-y", "@upstash/context7-mcp@latest"]
    category: docs
    recommended: true
    smokeCall:
      tool: resolve-library-id
      arguments:
        libraryName: React
        query: React documentation
    rationale: "LLM training data is stale. Live docs prevent hallucinated API usage."

  - name: sourcegraph
    description: "Sourcegraph MCP — SCIP-backed keyword/semantic search, go-to-definition, find-references, diffs, and repo history across every indexed repo (Enterprise v6.8+)."
    url: "${SOURCEGRAPH_URL}/.api/mcp"
    headers:
      Authorization: "token ${SOURCEGRAPH_ACCESS_TOKEN}"
    category: development
    recommended: false
    setupLink: "https://sourcegraph.com/docs/api/mcp"
    smokeCall:
      tool: list_repos
      arguments:
        query: agent
        limit: 1
    note: "Requires Sourcegraph Enterprise (Cloud or self-hosted) v6.8+ with mcp.enabled and MCP#ACCESS permission."
    setup:
      SOURCEGRAPH_URL:
        description: "Base URL of your Sourcegraph instance (without /.api/mcp)"
        steps:
          - "Use your Sourcegraph Cloud URL (e.g. https://sourcegraph.com) or self-hosted base URL"
          - "Do not include /.api/mcp — agentbrew appends that path automatically"
          - "Example: https://sourcegraph.com"
      SOURCEGRAPH_ACCESS_TOKEN:
        description: "Personal access token with MCP scope"
        link: "https://sourcegraph.com/user/settings/tokens"
        steps:
          - "Sign in to your Sourcegraph instance"
          - "Go to Settings → Access tokens"
          - "Create a token with the mcp scope (restricts access to MCP endpoints only)"
          - "Copy the token value — pass it as Authorization: token <value>"
    rationale: "Deterministic cross-repo code intelligence agentbrew cannot replicate — reference the official HTTP MCP endpoint, never fork it."

  - name: composio
    description: "Composio Connect — 1,000+ SaaS apps (Gmail, Notion, Slack, GitHub, Linear, HubSpot, Jira, …) through one HTTP MCP endpoint with managed OAuth and meta-tools."
    url: "https://connect.composio.dev/mcp"
    headers:
      x-consumer-api-key: "${COMPOSIO_CONSUMER_API_KEY}"
    category: productivity
    recommended: false
    setupLink: "https://docs.composio.dev/docs/composio-connect"
    smokeCall:
      tool: COMPOSIO_SEARCH_TOOLS
      arguments:
        use_case: search email tools
        limit: 1
    note: "Replaces per-vendor Notion/Jira/Linear/etc. MCP entries — connect each app once via Composio OAuth after install."
    setup:
      COMPOSIO_CONSUMER_API_KEY:
        description: "Composio consumer API key (starts with ck_)"
        link: "https://dashboard.composio.dev/"
        steps:
          - "Sign up or log in at dashboard.composio.dev"
          - "Open Settings → API Keys (or your client's Connect setup page)"
          - "Copy your consumer key (ck_...)"
          - "Paste it here — Composio handles OAuth for each connected SaaS app"
    rationale: |
      GET, don't host: one Composio Connect endpoint replaces N per-connector MCP catalog entries.
      Managed OAuth survives model swaps. Alternatives: Arcade.dev, Scalekit.

  - name: figma
    description: "Official Figma remote MCP — pull design context, variables, components and code connect mappings straight from a Figma file into the agent."
    url: "https://mcp.figma.com/mcp"
    category: design
    recommended: true
    setupLink: "https://developers.figma.com/docs/figma-mcp-server/remote-server-installation/"
    probeSuppression:
      statuses: ["init_error"]
      reason: "Figma authenticates with per-client OAuth; the token lives in each agent's own credential store, so agentbrew's unauthenticated probe always gets 401 even when every client is signed in and working."
      retryPolicy: probe-every-tick-no-heal-until-catalog-change
    note: "Sign in once per client — the first Figma tool call opens Figma's OAuth consent in a browser. Prefer this over the desktop server (127.0.0.1:3845), which only runs while the Figma desktop app is open in Dev Mode and needs a Dev/Full seat on a paid plan."
    rationale: |
      Official first-party endpoint, so there is nothing to host or fork: Figma runs the server and owns the OAuth flow.
      The remote server is available on every seat and plan and carries the broadest tool set, while the desktop variant
      is gated on a paid Dev/Full seat and dies whenever the desktop app closes — a bad fit for "works everywhere without
      me doing anything". Third-party forks (framelink figma-developer-mcp and friends) need a long-lived personal access
      token in plaintext and lag the official tool surface, so they lose on both security and capability.

  - name: ask-human
    description: "Async human-↔-agent comm channel — agent writes questions to ask_human.md, file watcher unblocks the agent when human edits PENDING→answer. 150★, MIT."
    command: pipx
    args: ["run", "ask-human-mcp"]
    category: collaboration
    recommended: false
    smokeCall:
      tool: list_pending_questions
    probeSuppression:
      statuses: ["init_timeout"]
      reason: "Already running asyncio in this thread before MCP initialize; upstream stdio launcher is currently broken."
      retryPolicy: probe-every-tick-no-heal-until-catalog-change
    note: "Not currently recommended: ask-human-mcp 0.1.0/0.1.1 fail in stdio mode with `Already running asyncio in this thread` before MCP initialize. Keep explicit opt-in until upstream fixes the launcher."
    rationale: |
      The async-human-comms convention from the shared-rules.md "Async human comms — ask_human.md" rule. Agents write questions
      to the repo's ask_human.md when they need operator decisions they can't make alone (vision-trace questions, irreversible
      choices, private-knowledge gaps). The MCP server provides file-watch so the agent unblocks the moment the operator types
      the answer, plus concurrent-question handling, file rotation, and size limits — features we would otherwise have to
      build. Source: github.com/masony817/ask-human-mcp.
      Per rule #1 (don't reinvent), this is the adopted convention — every agentbrew-managed agent should read ask_human.md
      automatically and respect its format. The CLI variant (`ask-human-mcp --file custom_qa.md`) supports per-project files
      if a repo wants to scope the inbox.

  - name: playwright
    description: "Browser automation — navigate, click, fill forms, screenshot, test. 11.6k★."
    command: npx
    # `--isolated` gives each MCP session an in-memory profile. Without it,
    # Playwright MCP keys its profile dir by workspace hash, so two agents
    # (Claude Code, Cursor, Devin, Windsurf) opening Playwright in the same
    # repo collide on the persistent profile lock — the second client errors
    # with `Browser is already in use for mcp-chrome-<hash>` (GH playwright
    # #40419, playwright-mcp #1594). Isolated mode is the upstream-recommended
    # fix for the multi-agent case. Trade-off: cookies/logins don't persist
    # across sessions — agents that need persistence should use a separate
    # debug-port Chrome (e.g. agent-browser at :9223) instead of Playwright MCP.
    #
    # `--browser chrome` drives the locally-installed Google Chrome (stable)
    # rather than Playwright's bundled Chrome-for-Testing build. The bundled
    # build shows an "only for automated testing" banner and is slower to cold-
    # start; the stable channel is faster and already present on dev machines.
    # Orthogonal to `--isolated` (which controls the profile, not the binary),
    # so the multi-agent collision fix above still holds.
    args: ["-y", "@playwright/mcp@latest", "--isolated", "--browser", "chrome"]
    category: browser
    recommended: true
    smokeCall:
      tool: browser_console_messages
      arguments:
        level: info
        all: false
    probe: fast
    rationale: "Browser automation via MCP — structured tool calls beat shell scripts for web testing."

  - name: chrome-devtools
    description: "Google ChromeDevTools team's official MCP — Lighthouse audits, performance traces, accessibility tree, live DOM, console errors, network logs. Bundles MCP + Skills."
    command: npx
    args: ["-y", "chrome-devtools-mcp@latest", "--isolated"]
    category: browser
    recommended: true
    smokeCall:
      tool: list_pages
    probe: fast
    rationale: "Closes the 'design that performs' gap (Core Web Vitals + a11y) that screenshot-only browser tools miss. Free, no API key. Pairs naturally with playwright MCP — screenshots for visual fidelity, chrome-devtools for performance + accessibility metrics."

  - name: shadcn-mcp
    description: "shadcn/ui MCP server (CLI 3.0, zero-config) — browse, search, view, and install components from any shadcn-compatible registry via natural language. May 2026 added registry include + validate."
    command: npx
