  experimental: true

- name: kilo
  skillsDir: ~/.kilocode/skills
  # rulesFile: ai-rules writes AGENTS.md for kilocode (renamed from kilo
  # by rules-agent-map.ts); agentbrew deploys the wrapped output here.
  # Graduated from experimental by slice 3c of `delegate-rules-to-ai-rules`
  # because adding any non-skills sync surface violates the
  # "experimental ⇒ skills-only" invariant (src/core/agents.test.ts).
  # ai-rules upstream lists kilocode in its supported agents, signaling
  # enough real-world validation to drop the experimental badge.
  rulesFile: ~/.kilocode/AGENTS.md

- name: droid
  skillsDir: ~/.factory/skills
  experimental: true

- name: openclaw
  skillsDir: ~/.openclaw/skills
  experimental: true

- name: pi
