- name: firebender
  skillsDir: ~/.firebender/skills
  # rulesFile: ai-rules writes AGENTS.md for firebender; agentbrew deploys
  # the wrapped output here. Graduated from experimental by slice 3c of
  # `delegate-rules-to-ai-rules` because adding any non-skills sync
  # surface violates the "experimental ⇒ skills-only" invariant
  # (src/core/agents.test.ts). ai-rules upstream lists firebender in its
  # supported agents, signaling enough real-world validation to drop the
  # experimental badge.
  rulesFile: ~/.firebender/AGENTS.md
  # commandsDir: ai-rules generates commands for firebender at
  # `<project>/.firebender/commands/<name>-ai-rules.mdc`; agentbrew
  # deploys the wrapped output to a user-level path mirroring
  # `~/.firebender/`. Added by slice 5 of `delegate-commands-to-ai-rules`
  # as a free-capability gain — no native commandTransform code path.
  # The `.mdc` extension matches firebender's expected file shape per
  # ai-rules' upstream docs.
  commandsDir: ~/.firebender/commands
  commandFileExt: .mdc

