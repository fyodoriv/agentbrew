# sources.yaml — canonical registry of skill, MCP, and rule sources
# Used by `agentbrew sync` for periodic fetching and by `agentbrew catalog --sources` for discovery.
# Each source declares what it provides so agentbrew knows what to fetch.
#
# Schema:
#   name:        GitHub shorthand (user/repo) or URL
#   description: What this source offers
#   provides:    [skills] | [skills, mcp] | [skills, rules] — what to fetch
#   category:    Grouping for display
#   recommended: true = auto-add on `agentbrew install --recommended`

# ── Official / Major ──────────────────────────────────────────────

- name: anthropics/skills
  description: "Official Anthropic — frontend-design, mcp-builder, skill-creator, webapp-testing, pdf/docx/xlsx/pptx"
  provides: [skills]
  category: official
  recommended: true

- name: anthropics/claude-plugins-official
  description: "Official Anthropic plugin marketplace (23.8k★) — frontend-design (760k installs), build-mcp-app, build-mcp-server, mcp-server-dev, hookify, code-modernization, ralph-loop, pr-review-toolkit, skill-creator, session-report, agent-sdk-dev, security-guidance, plugin-dev, and 11 LSP plugins. By May 2026 the canonical distribution channel for Claude Code."
  provides: [skills]
  category: official
  recommended: true

- name: modelcontextprotocol/ext-apps
  description: "Official MCP Apps protocol repo (SEP-1865, stabilized 2026-01-26, 2.3k★). MCP tools can declare ui:// resources that render as sandboxed iframes inside Claude, ChatGPT, VS Code, Goose, Postman, MCPJam. Provides 4 skills: create-mcp-app (scaffold), migrate-oai-app (OpenAI Apps SDK port), add-app-to-server (retrofit), convert-web-app (hybrid)."
  provides: [skills]
  category: official
  recommended: true

